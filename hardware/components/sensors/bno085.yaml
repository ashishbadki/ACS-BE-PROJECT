identity:
  id: bno085
  name: BNO085
  manufacturer: CEVA / Hillcrest Labs
  part_number: BNO085
  description: 9-axis sensor hub System in Package with integrated accelerometer, gyroscope, magnetometer, sensor fusion, and embedded processing.

classification:
  category: sensor
  subcategory: imu

capabilities:
  - acceleration
  - angular_velocity
  - magnetic_field
  - orientation
  - rotation_vector
  - gravity
  - linear_acceleration
  - sensor_fusion
  - activity_classification

interfaces:
  - i2c
  - spi
  - uart

pins:
  - name: VDD
    type: power
    direction: power
    required: true

  - name: VDDIO
    type: power
    direction: power
    required: true

  - name: GND
    type: ground
    direction: power
    required: true

  - name: HOST_SDA
    type: i2c_data
    direction: bidirectional
    required: false

  - name: HOST_SCL
    type: i2c_clock
    direction: bidirectional
    required: false

  - name: HOST_INTN
    type: interrupt
    direction: output
    required: false

  - name: RSTN
    type: control
    direction: input
    required: true

  - name: BOOTN
    type: control
    direction: input
    required: false

  - name: PS1
    type: control
    direction: input
    required: false

  - name: PS0
    type: control
    direction: input
    required: false

electrical:
  voltage:
    min: 2.4
    typical: 3.3
    max: 3.6
    unit: V

compatibility:
  controllers:
    - esp32
  frameworks:
    - arduino

software:
  libraries:
    - Adafruit BNO08x
  frameworks:
    - Arduino
  languages:
    - C++

hal:
  operations:
    - name: read_orientation
      description: Read fused orientation data.

    - name: read_acceleration
      description: Read acceleration data.

    - name: read_angular_velocity
      description: Read gyroscope angular velocity data.

    - name: read_magnetic_field
      description: Read magnetic field data.

    - name: read_linear_acceleration
      description: Read linear acceleration data.

constraints:
  - Host communication can use I2C, SPI, or UART depending on protocol-selection configuration.
  - Protocol selection pins are sampled at reset.
  - VDD must remain within the specified 2.4 V to 3.6 V range.
  - VDDIO must remain within the specified 1.65 V to 3.6 V range.
  - Exact host pin configuration depends on the selected communication protocol.
  - The 32.768 kHz crystal requirement applies to the BNO085 device-level design.
  - A suitable hardware interface configuration is required before firmware generation.

safety:
  - Do not exceed the specified VDD or VDDIO voltage limits.
  - Do not connect incompatible host-interface voltage levels.